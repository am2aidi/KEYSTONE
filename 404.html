<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>

  <header class="fixed top-0 left-0 right-0 z-50 py-4 px-6 sm:px-12 flex items-center justify-between backdrop-blur-md bg-black/40 border-b border-white/10">

              <path d="M213 110v61M226 99v72" stroke="#fff0c6" stroke-width="5"></path>

            </g>
            <g class="rise rise-4">
              <path d="M159 188l110-96 117 96" stroke="#FFFFFF" stroke-width="17"></path>
              <path d="M196 188l73-64 75 64" stroke="#d2a03c" stroke-width="10"></path>
              <path d="M238 188l31-27 32 27" stroke="#173d6c" stroke-width="8"></path>
              <path d="M144 195h257" stroke="#FFFFFF" stroke-width="6"></path>
            </g>
          </g>
          <g class="wordmark">
            <text x="360" y="260" text-anchor="middle" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="64" font-weight="900" letter-spacing="4">KEYSTONE</text>

    </a>

    <div class="flex items-center gap-4">
      <button onclick="window.toggleKeystoneTheme()" class="forma-btn-outline !py-2 !px-4" title="Toggle Black / White Glass Theme">
        <i data-lucide="sun" class="w-4 h-4 text-gold-400 dark:block hidden"></i>
        <i data-lucide="moon" class="w-4 h-4 text-gold-400 dark:hidden block"></i>
        <span class="text-[11px]">THEME</span>
      </button>

      <a href="index.html" class="forma-btn-outline !py-2 !px-4">
        <span>RETURN TO HOME</span>
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </a>
    </div>
  </header>

  <!-- 404 MAIN CONTENT -->
  <main class="flex-1 flex items-center justify-center px-6 sm:px-12 py-32 relative z-10">
    <div class="forma-card max-w-2xl w-full p-10 sm:p-14 text-center space-y-6">
      <p class="font-forma-mono text-xs text-gold-400 tracking-[0.25em]">404 ERROR · BLUEPRINT UNRESOLVED</p>
      
      <h1 class="font-forma text-7xl sm:text-9xl font-bold text-white tracking-tight leading-none">
        404
      </h1>

      <h2 class="font-forma text-3xl sm:text-4xl font-bold text-white uppercase tracking-wide">
        SPATIAL COORDINATE NOT FOUND
      </h2>

      <p class="text-slate-300 text-sm font-light leading-relaxed max-w-md mx-auto">

      </p>

      <div class="pt-4 flex flex-wrap justify-center gap-4">
        <a href="index.html" class="forma-btn-outline">

        <a href="client-portal.html" class="forma-btn-outline">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          <span>CLIENT PORTAL</span>
        </a>

    </div>
